<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmaRev — Redirecionando...</title>
<style>
  body{
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:#0a0f0d; color:#e9f2ec;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; margin:0; padding:24px; text-align:center;
  }
  .box{max-width:420px}
  h1{font-size:20px; margin-bottom:12px}
  p{color:#8aa094; line-height:1.6; font-size:14.5px}
  #fallback{display:none; margin-top:28px; padding-top:20px; border-top:1px solid #22322a}
  #fallback strong{color:#e9f2ec}
  a{color:#8fff6b}
</style>
</head>
<body>
<div class="box">
  <h1>Voltando para o FarmaRev…</h1>
  <p>Aguarde, seu login está sendo concluído.</p>

  <div id="fallback">
    <p><strong>Não foi possível abrir o app automaticamente.</strong></p>
    <p>
      Se o FarmaRev não abriu, feche esta página e tente novamente pelo app.
      Se o problema persistir, entre em contato:
      <a href="mailto:farmarevcontato@gmail.com">farmarevcontato@gmail.com</a>
    </p>
  </div>
</div>

<script>
  // 🐛 [OAUTH-DEEPLINK-02 — CORRIGIDO] Esta era a peça que faltava: a
  // página já existia e já mostrava a mensagem de aviso, mas nunca
  // chegava a REDIRECIONAR de volta para o app — por isso o aviso
  // "não foi possível abrir automaticamente" sempre aparecia, mesmo
  // com o Android configurado corretamente (o esquema farmarev:// só
  // funciona se algo pedir para o navegador abri-lo).
  //
  // O Google redireciona para cá como:
  //   https://feli-dev-hy.github.io/farmarev-legal/oauth.html?code=...&state=...
  // Precisamos repassar EXATAMENTE os mesmos parâmetros (code e state)
  // para o app — main.py já sabe extraí-los de page.route/page.query
  // (função _extrair_params_oauth), então não é preciso mudar nada do
  // lado Python.
  var params  = window.location.search;                 // "?code=...&state=..."
  var destino = "farmarev://oauth" + params;

  window.location.href = destino;

  // Se o app não abrir em ~2.5s (esquema não registrado, app não
  // instalado, ou o usuário cancelou o app-chooser), mostra a mensagem
  // de apoio em vez de deixar a pessoa olhando para uma tela vazia.
  setTimeout(function () {
    document.getElementById("fallback").style.display = "block";
  }, 2500);
</script>
</body>
</html>
